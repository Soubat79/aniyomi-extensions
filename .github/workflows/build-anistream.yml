name: Build AniStream
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: ./gradlew :src:en:anistream:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: anistream-apk
          path: src/en/anistream/build/outputs/apk/debug/*.apk
